<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Scoreboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h1>Football Scoreboard</h1>

<p>Jalkapallon ottelutiedot</p>

<h2>Ottelut</h2>

<p id="tulos">Haetaan otteluita...</p>
<div class="suodattimet">
    <button class="suodatin aktiivinen" data-suodatin="kaikki">
        Kaikki ottelut
    </button>

    <button class="suodatin" data-suodatin="kaynnissa">
        Käynnissä
    </button>

    <button class="suodatin" data-suodatin="paattyneet">
        Päättyneet
    </button>

</div>

<div id="ottelut"></div>

<script src="js/script.js"></script>

</body>
</html>
